<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CompRent | Wypożyczalnia laptopów</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #f4f6fa;
            color: #1a2c3e;
            line-height: 1.4;
        }

        .navbar {
            background: white;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid #e9edf2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            position: relative;
        }

        .ball {
            position: absolute;
            border-radius: 50%;
        }

        .ball1 { width: 18px; height: 18px; background: #ff6b9d; top: 0; left: 50%; transform: translateX(-50%); }
        .ball2 { width: 16px; height: 16px; background: #ffb347; bottom: 2px; left: 2px; }
        .ball3 { width: 16px; height: 16px; background: #6c5ce7; bottom: 2px; right: 2px; }
        .ball4 { width: 14px; height: 14px; background: #00cec9; top: 10px; left: 2px; }
        .ball5 { width: 14px; height: 14px; background: #fd79a8; top: 10px; right: 2px; }
        .center-dot { width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #1f6392;
            letter-spacing: -0.3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 500;
            color: #4a627a;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover { color: #1f6392; }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f0f4fa;
            padding: 6px 20px;
            border-radius: 40px;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #c2412c;
            font-weight: 500;
            cursor: pointer;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 32px;
        }

        .search-wrapper {
            margin-bottom: 32px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid #dce3ec;
            background: white;
            font-size: 16px;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #1f6392;
            box-shadow: 0 0 0 3px rgba(31,99,146,0.1);
        }

        .shop-layout {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .filter-panel {
            width: 280px;
            background: white;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #eef2f8;
            height: fit-content;
            position: sticky;
            top: 90px;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
        }

        .filter-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .clear-filters {
            background: none;
            border: none;
            color: #1f6392;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        .filter-section {
            margin-bottom: 24px;
            border-bottom: 1px solid #f0f4f9;
            padding-bottom: 20px;
        }

        .filter-section label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .filter-select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid #dce3ec;
            background: white;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            font-size: 14px;
            cursor: pointer;
        }

        .price-range {
            display: flex;
            gap: 12px;
        }

        .price-range input {
            width: 50%;
            padding: 10px;
            border-radius: 40px;
            border: 1px solid #dce3ec;
        }

        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #eef2f8;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1);
        }

        .product-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #f0f4fa;
        }

        .product-info {
            padding: 18px;
        }

        .product-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-specs {
            font-size: 13px;
            color: #5b6e8c;
            margin: 8px 0;
        }

        .product-price {
            font-size: 22px;
            font-weight: 700;
            color: #1f6392;
            margin-top: 12px;
        }

        .no-results {
            flex: 1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 28px;
            color: #6c7f96;
        }

        .breadcrumb {
            font-size: 14px;
            color: #6c7f96;
            margin-bottom: 24px;
        }

        .breadcrumb span {
            cursor: pointer;
        }

        .breadcrumb span:hover {
            color: #1f6392;
            text-decoration: underline;
        }

        .product-detail-card {
            background: white;
            border-radius: 32px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .product-detail-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 28px;
        }

        .product-detail-title {
            font-size: 28px;
            font-weight: 700;
        }

        .detail-price {
            font-size: 36px;
            font-weight: 800;
            color: #1f6392;
        }

        .rent-button {
            background: #1f6392;
            border: none;
            padding: 12px 36px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .rent-button:hover {
            background: #0f4a6e;
        }

        .specs-table {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            background: #f8fafd;
            padding: 20px;
            border-radius: 24px;
            margin: 24px 0;
        }

        .profile-card {
            background: white;
            border-radius: 32px;
            padding: 32px;
        }

        .profile-tabs {
            display: flex;
            gap: 28px;
            border-bottom: 1px solid #eef2f8;
            margin-bottom: 28px;
        }

        .profile-tab {
            background: none;
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            color: #6c7f96;
            cursor: pointer;
        }

        .profile-tab.active {
            color: #1f6392;
            border-bottom: 2px solid #1f6392;
        }

        .form-double {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-field label {
            font-size: 13px;
            font-weight: 600;
        }

        .input-field input {
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #dce3ec;
            font-size: 14px;
        }

        .save-button {
            background: #1f6392;
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-item {
            background: #f8fafd;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid #eef2f8;
        }

        .order-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-active {
            background: #e6f7e6;
            color: #2e7d32;
        }

        .status-returned {
            background: #ffe6e5;
            color: #c2412c;
        }

        .return-btn {
            background: #c2412c;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .admin-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eef2f8;
        }

        .admin-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-product-btn {
            background: #eef2ff;
            color: #1f6392;
        }
        .edit-product-btn:hover {
            background: #1f6392;
            color: white;
        }
        .delete-product-btn {
            background: #fee2e2;
            color: #c2412c;
        }
        .delete-product-btn:hover {
            background: #c2412c;
            color: white;
        }

        .add-product-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 32px;
            border: 2px dashed #1f6392;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 12px;
            color: #2c3e50;
        }

        .form-group input {
            padding: 10px 14px;
            border: 1px solid #dce3ec;
            border-radius: 40px;
            font-size: 14px;
        }

        .btn-add {
            background: #1f6392;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: white;
            padding: 10px 20px;
            border-radius: 60px;
            width: fit-content;
        }

        .tab {
            background: none;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px;
            color: #6c7f96;
        }

        .tab.active {
            background: #1f6392;
            color: white;
        }

        .logs-list {
            background: white;
            border-radius: 24px;
            padding: 20px;
        }

        .log-item {
            border-bottom: 1px solid #eef2f8;
            padding: 12px 0;
            font-size: 13px;
        }

        .log-date {
            color: #8ba0bc;
            font-size: 11px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 24px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: #1f6392;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f5;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.08);
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }

        .auth-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 28px;
            color: #1a2c3e;
        }

        .auth-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 30px;
            border: 1px solid #dce3ec;
            font-size: 15px;
            margin-bottom: 16px;
        }

        .auth-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .auth-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            font-size: 13px;
            color: #4a627a;
        }

        .auth-btn {
            width: 100%;
            background: #1f6392;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .auth-back {
            width: 100%;
            background: none;
            border: none;
            color: #6c7f96;
            margin-top: 16px;
            cursor: pointer;
            text-align: center;
        }

        .error-msg {
            color: #c2412c;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }

        .admin-link {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
        }
        .admin-link a {
            color: #1f6392;
            text-decoration: none;
        }

        @media (max-width: 800px) {
            .filter-panel { width: 100%; position: static; }
            .container { padding: 20px; }
            .auth-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    const LAPTOPS = [
        { id:1, name:"Acer Nitro V 16 AI", subtitle:"16″ IPS 180Hz · R5-240 · 16GB · 1TB SSD", specs:{ procesor:"AMD Ryzen 5 240", ram:"16GB", dysk:"1TB SSD", karta:"RTX 4050", ekran:"16″ IPS 180Hz", system:"Windows 11" }, price:374, rating:4.5, brand:"Acer", ram:"16GB", storage:"1TB", gpu:"RTX 4050", screen:"16″", image:"https://picsum.photos/id/0/300/180", description:"Acer Nitro V 16 AI – idealny dla graczy i twórców." },
        { id:2, name:"Apple MacBook Neo 2026", subtitle:"13″ Retina · A18 Pro · 8GB · 512GB", specs:{ procesor:"Apple A18 Pro", ram:"8GB", dysk:"512GB SSD", karta:"Apple GPU", ekran:"13″ Retina", system:"macOS" }, price:291, rating:4.8, brand:"Apple", ram:"8GB", storage:"512GB", gpu:"Integrated", screen:"13″", image:"https://picsum.photos/id/1/300/180", description:"MacBook Neo z A18 Pro – wydajność i styl." },
        { id:3, name:"Lenovo IdeaPad Slim 5", subtitle:"16″ IPS · R7-7735HS · 32GB · 512GB", specs:{ procesor:"AMD Ryzen 7 7735HS", ram:"32GB", dysk:"512GB SSD", karta:"AMD Radeon 680M", ekran:"16″ IPS", system:"Windows 11" }, price:291, rating:4.2, brand:"Lenovo", ram:"32GB", storage:"512GB", gpu:"AMD Radeon", screen:"16″", image:"https://picsum.photos/id/20/300/180", description:"Świetny do wielozadaniowości." },
        { id:4, name:"Apple MacBook Air 2026", subtitle:"15.3″ Retina · M5 · 16GB · 512GB", specs:{ procesor:"Apple M5", ram:"16GB", dysk:"512GB SSD", karta:"Apple M5", ekran:"15.3″ Liquid Retina", system:"macOS" }, price:541, rating:4.9, brand:"Apple", ram:"16GB", storage:"512GB", gpu:"Integrated", screen:"15.3″", image:"https://picsum.photos/id/26/300/180", description:"Najlepszy Air w historii." },
        { id:5, name:"Asus Vivobook 15", subtitle:"15.6″ IPS · Core 5 120U · 16GB · 512GB", specs:{ procesor:"Intel Core 5 120U", ram:"16GB", dysk:"512GB SSD", karta:"Intel Graphics", ekran:"15.6″ IPS", system:"Windows 11" }, price:208, rating:4.0, brand:"Asus", ram:"16GB", storage:"512GB", gpu:"Intel", screen:"15.6″", image:"https://picsum.photos/id/42/300/180", description:"Ekonomiczny laptop do codziennych zadań." },
        { id:6, name:"Dell XPS 15", subtitle:"15.6″ OLED · i7 · 32GB · 1TB · RTX4060", specs:{ procesor:"Intel i7", ram:"32GB", dysk:"1TB SSD", karta:"RTX 4060", ekran:"15.6″ OLED", system:"Windows 11" }, price:489, rating:4.7, brand:"Dell", ram:"32GB", storage:"1TB", gpu:"RTX 4060", screen:"15.6″", image:"https://picsum.photos/id/96/300/180", description:"Premium, ekran OLED." },
        { id:7, name:"HP Spectre x360", subtitle:"14″ OLED · i7 · 16GB · 1TB", specs:{ procesor:"Intel i7", ram:"16GB", dysk:"1TB SSD", karta:"Intel Iris", ekran:"14″ OLED", system:"Windows 11" }, price:399, rating:4.4, brand:"HP", ram:"16GB", storage:"1TB", gpu:"Intel Iris", screen:"14″", image:"https://picsum.photos/id/106/300/180", description:"Konwertowalny 2w1." }
    ];

    let products = [...LAPTOPS];
    let orders = [];
    let logs = [];
    let users = [];
    let currentUser = null;
    let currentView = 'shop';
    let selectedProduct = null;
    let currentTab = 'shop';
    let authView = 'welcome';
    let isAdminMode = false;
    let filters = { brand: '', ram: [], minPrice: '', maxPrice: '', search: '' };

    function isValidEmail(email) { return /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email); }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

    function saveData() {
        localStorage.setItem('comprent_users', JSON.stringify(users));
        localStorage.setItem('comprent_currentUser', JSON.stringify(currentUser));
        localStorage.setItem('comprent_products', JSON.stringify(products));
        localStorage.setItem('comprent_orders', JSON.stringify(orders));
        localStorage.setItem('comprent_logs', JSON.stringify(logs));
    }

    function loadData() {
        const savedUsers = localStorage.getItem('comprent_users');
        const savedCurrent = localStorage.getItem('comprent_currentUser');
        const savedProducts = localStorage.getItem('comprent_products');
        const savedOrders = localStorage.getItem('comprent_orders');
        const savedLogs = localStorage.getItem('comprent_logs');
        
        if (savedUsers) users = JSON.parse(savedUsers);
        if (savedCurrent) currentUser = JSON.parse(savedCurrent);
        if (savedProducts) products = JSON.parse(savedProducts);
        if (savedOrders) orders = JSON.parse(savedOrders);
        if (savedLogs) logs = JSON.parse(savedLogs);
    }

    function addLog(action, details) {
        logs.unshift({ id: Date.now(), date: new Date().toLocaleString('pl-PL'), action: action, details: details });
        if (logs.length > 100) logs.pop();
        saveData();
    }

    function getOrders(userId) { return orders.filter(o => o.userId === userId); }
    function saveOrder(order) { orders.push(order); saveData(); addLog('NOWE WYPOŻYCZENIE', `${order.productName} - ${order.price} zł`); }
    function returnOrder(orderId) { const idx = orders.findIndex(o => o.id === orderId && o.status === 'active'); if (idx !== -1) { orders[idx].status = 'returned'; orders[idx].returnDate = new Date().toISOString().slice(0, 10); saveData(); addLog('ZWROT', `${orders[idx].productName}`); return true; } return false; }

    function hasAnyAdmin() { return users.some(u => u.role === 'admin'); }

    function init() {
        loadData();
        if (users.length === 0) {
            users = [];
            saveData();
        }
        if (orders.length === 0) orders = [];
        if (products.length === 0) products = [...LAPTOPS];
        saveData();
    }

    function render() {
        const root = document.getElementById('app');
        
        if (!currentUser) {
            renderAuth(root);
            return;
        }
        
        if (currentUser.role === 'admin' && isAdminMode) {
            renderAdminPanel(root);
        } else {
            if (currentView === 'profile') renderProfile(root, currentUser);
            else if (currentView === 'product' && selectedProduct) renderProductDetail(root, currentUser, selectedProduct);
            else renderShop(root, currentUser);
        }
    }

    function renderAuth(root) {
        const adminExists = hasAnyAdmin();
        
        if (authView === 'welcome') {
            root.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-logo">
                            <div style="position:absolute; width:32px; height:32px; background:#ff6b9d; border-radius:50%; top:0; left:50%; transform:translateX(-50%);"></div>
                            <div style="position:absolute; width:28px; height:28px; background:#ffb347; border-radius:50%; bottom:5px; left:5px;"></div>
                            <div style="position:absolute; width:28px; height:28px; background:#6c5ce7; border-radius:50%; bottom:5px; right:5px;"></div>
                            <div style="position:absolute; width:24px; height:24px; background:#00cec9; border-radius:50%; top:15px; left:5px;"></div>
                            <div style="position:absolute; width:24px; height:24px; background:#fd79a8; border-radius:50%; top:15px; right:5px;"></div>
                            <div style="position:absolute; width:36px; height:36px; background:white; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%);"></div>
                        </div>
                        <div class="auth-title">CompRent</div>
                        <div style="display:flex; gap:16px;">
                            <button id="clientLoginBtn" class="auth-btn">Logowanie klienta</button>
                            <button id="clientRegisterBtn" class="auth-btn" style="background:transparent; border:1.5px solid #1f6392; color:#1f6392;">Rejestracja klienta</button>

    function renderClientProducts() {
        const grid = document.getElementById('productsGrid'); 
        if (!grid) return;
        
        let filtered = [...products];
        if (filters.search) filtered = filtered.filter(p => p.name.toLowerCase().includes(filters.search.toLowerCase()) || p.brand.toLowerCase().includes(filters.search.toLowerCase()));
        if (filters.brand) filtered = filtered.filter(p => p.brand === filters.brand);
        if (filters.ram.length) filtered = filtered.filter(p => filters.ram.includes(p.ram));
        if (filters.minPrice) filtered = filtered.filter(p => p.price >= parseFloat(filters.minPrice));
        if (filters.maxPrice) filtered = filtered.filter(p => p.price <= parseFloat(filters.maxPrice));
        
        if (!filtered.length) { grid.innerHTML = '<div class="no-results">😢 Brak laptopów</div>'; return; }
        grid.innerHTML = filtered.map(p => `<div class="product-card" data-id="${p.id}"><img class="product-img" src="${p.image}" onerror="this.src='https://picsum.photos/id/1/300/180'"><div class="product-info"><div class="product-name">${escapeHtml(p.name)}</div><div class="product-specs">${escapeHtml(p.subtitle)}</div><div class="product-price">${p.price} zł / miesiąc</div></div></div>`).join('');
        document.querySelectorAll('.product-card').forEach(card => { card.addEventListener('click', () => { selectedProduct = products.find(l => l.id == card.dataset.id); currentView = 'product'; render(); }); });
    }

        });
        if (currentTab === 'shop') {
            document.getElementById('searchInput')?.addEventListener('input', () => renderAdminProducts());
            document.getElementById('brandFilter')?.addEventListener('change', () => renderAdminProducts());
            document.getElementById('minPriceAdmin')?.addEventListener('input', () => renderAdminProducts());
            document.getElementById('maxPriceAdmin')?.addEventListener('input', () => renderAdminProducts());
            document.querySelectorAll('.ramFilterAdmin').forEach(cb => cb.addEventListener('change', () => renderAdminProducts()));
            document.getElementById('clearFilters')?.addEventListener('click', () => {
                const searchInput = document.getElementById('searchInput');
                const brandFilter = document.getElementById('brandFilter');
                const minPrice = document.getElementById('minPriceAdmin');
                const maxPrice = document.getElementById('maxPriceAdmin');
                if (searchInput) searchInput.value = '';
                if (brandFilter) brandFilter.value = '';
                if (minPrice) minPrice.value = '';
                if (maxPrice) maxPrice.value = '';
                document.querySelectorAll('.ramFilterAdmin').forEach(cb => cb.checked = false);
                renderAdminProducts();
            });
        }
    }

    function renderAdminProducts() {
        const grid = document.getElementById('adminProductsGrid'); 
        if (!grid) return;
        
        const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const brand = document.getElementById('brandFilter')?.value || '';
        const minPrice = parseFloat(document.getElementById('minPriceAdmin')?.value) || 0;
        const maxPrice = parseFloat(document.getElementById('maxPriceAdmin')?.value) || Infinity;
        const selectedRam = Array.from(document.querySelectorAll('.ramFilterAdmin:checked')).map(cb => cb.value);
        
        let filtered = products.filter(p => {
            if (search && !p.name.toLowerCase().includes(search) && !p.brand.toLowerCase().includes(search)) return false;
            if (brand && p.brand !== brand) return false;
            if (p.price < minPrice || p.price > maxPrice) return false;
            if (selectedRam.length > 0 && !selectedRam.includes(p.ram)) return false;
            return true;
        });
        if (!filtered.length) { grid.innerHTML = '<div class="no-results">😢 Brak laptopów</div>'; return; }
        grid.innerHTML = filtered.map(p => `<div class="product-card"><img class="product-img" src="${p.image}" onerror="this.src='https://picsum.photos/id/1/300/180'"><div class="product-info"><div class="product-name">${escapeHtml(p.name)}</div><div class="product-specs">${escapeHtml(p.subtitle)}</div><div class="product-price">${p.price} zł / miesiąc</div><div class="admin-buttons"><button class="edit-product-btn" data-id="${p.id}">✏️ Edytuj</button><button class="delete-product-btn" data-id="${p.id}">🗑️ Usuń</button></div></div></div>`).join('');
        document.querySelectorAll('.edit-product-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(btn.dataset.id); const prod = products.find(p => p.id === id); if (prod) { const newName = prompt('Nowa nazwa:', prod.name); if (newName) { const newPrice = parseFloat(prompt('Nowa cena:', prod.price)); if (!isNaN(newPrice)) { prod.name = newName; prod.price = newPrice; saveData(); addLog('EDYTOWANO', `${newName} (${newPrice} zł)`); renderAdminProducts(); } } } }); });
        document.querySelectorAll('.delete-product-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); if (confirm('Usunąć produkt?')) { const id = parseInt(btn.dataset.id); const prod = products.find(p => p.id === id); const newProducts = products.filter(p => p.id !== id); products = newProducts; saveData(); addLog('USUNIĘTO', prod?.name || 'produkt'); renderAdminProducts(); } }); });
    }

    init();
    render();
</script>
</body>
</html>
